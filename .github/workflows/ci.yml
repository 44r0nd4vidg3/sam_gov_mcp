name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest --cov=sam_gov_mcp --cov-report=term-missing

  smoke:
    name: Install and start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A non-editable install, so a missing subpackage cannot be masked by
      # the source tree sitting on sys.path.
      - name: Install from the built distribution
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Server constructs and answers a real MCP handshake
        env:
          SAM_API_KEY: ci-placeholder-key
        run: python scripts/smoke_test.py
