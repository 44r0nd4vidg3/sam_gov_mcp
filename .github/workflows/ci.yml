name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify the package imports and the server builds
        env:
          SAM_API_KEY: ci-placeholder-key
        run: python -c "from sam_gov_mcp.server import MCPServer; MCPServer(); print('server constructed')"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest --cov=sam_gov_mcp --cov-report=term-missing
